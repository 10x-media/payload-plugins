services:
  mongo:
    image: mongo:8
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '${MONGO_E2E_PORT:-37017}:27017'
    healthcheck:
      test: |
        mongosh --quiet --eval '
          try {
            rs.status().ok
          } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]}).ok
          }
        '
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: sse_e2e
    ports:
      - '${PG_E2E_PORT:-35432}:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'e2e', '-d', 'sse_e2e']
      interval: 2s
      timeout: 5s
      retries: 30
