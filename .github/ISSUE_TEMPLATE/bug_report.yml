name: Bug report
description: Report a bug in a @10x-media plugin.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Before filing, search existing issues and [Discussions](https://github.com/10x-media/payload-plugins/discussions) to avoid duplicates.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Include any error messages or stack traces.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce. The clearer, the faster the fix.
      placeholder: |
        1. Install @10x-media/automations
        2. Configure with ...
        3. Call ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - automations
        - other (describe in steps)
    validations:
      required: true
  - type: input
    id: payload-version
    attributes:
      label: Payload version
      placeholder: "e.g. 3.17.0"
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - MongoDB
        - PostgreSQL
        - Both
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: "e.g. 22.4.0"
    validations:
      required: false
  - type: input
    id: repro-link
    attributes:
      label: Minimal reproduction link
      description: A repo, StackBlitz, or Codesandbox that reproduces the issue.
      placeholder: "https://github.com/..."
    validations:
      required: false
