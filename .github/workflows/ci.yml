name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAYLOAD_SKIP_AUTOGEN: '1'
  # Primary Node version for single-version jobs. The test matrix below pins the
  # versions to forward-test. Bump both together when moving to the next LTS.
  NODE_VERSION: '22'
  # The commit each job's affected scope diffs HEAD against: a pull request's base, a
  # push's previous tip, and empty for anything else (workflow_dispatch), which
  # scripts/ci-affected.sh turns into a whole-workspace run. Resolved once here because a
  # job-level env block cannot see another job's outputs without serializing on it.
  AFFECTED_BASE_SHA: >-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha
    || github.event.before }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: scope
        name: Resolve affected scope
        run: bash scripts/ci-affected.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run lint ${{ steps.scope.outputs.flag }}
      # Cross-cutting invariants, cheap and unscoped: template drift is exactly the class of
      # bug that hides in the packages an affected run skips.
      - name: Template parity (files every plugin carries verbatim)
        run: pnpm check:template
      # Every docs page's internal links, and the analytics docs' code examples type-checked
      # against the package's source (about ten seconds). Only when the change reaches one of
      # them: a docs page selects the docs app, and a source change reaches analytics through
      # the package graph. The scope fallback lists both, so it always runs then.
      - id: docs-reach
        name: Does the change reach the docs?
        run: |
          reached=$(pnpm exec turbo ls ${{ steps.scope.outputs.flag }} --filter=@10x-media/docs --filter=@10x-media/analytics --output=json |
            jq '.packages.items | length > 0')
          echo "docs affected: ${reached}"
          echo "reached=${reached}" >>"$GITHUB_OUTPUT"
      - if: steps.docs-reach.outputs.reached == 'true'
        name: Docs links and analytics examples
        run: pnpm docs:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: scope
        name: Resolve affected scope
        run: bash scripts/ci-affected.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run typecheck ${{ steps.scope.outputs.flag }}
      # The root scripts belong to no package, so no turbo task reaches them; a few seconds, unscoped.
      - name: Root scripts
        run: pnpm typecheck:scripts

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: scope
        name: Resolve affected scope
        run: bash scripts/ci-affected.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `--filter` and `--affected` intersect rather than union, so this stays the published
      # packages only, narrowed to the ones this change reaches through the graph.
      - run: pnpm exec turbo run build --filter='./packages/*' ${{ steps.scope.outputs.flag }}
      # --only-built skips the packages the line above deliberately did not build.
      - name: Verify published dist output (directives, externals, exports, publint)
        run: pnpm check:dist --only-built
      # Packages with `"apiReport": true` keep an API Extractor report per entry under `api/`; a
      # surface change fails here until `pnpm api:update` commits it. Same skip as the line above.
      - name: API reports (public surface matches the checked-in reports)
        run: pnpm api:check --only-built
      # turbo runs a task's `dependsOn` even where the task itself is missing, so this gate
      # also runs the affected dev apps' and the docs site's `next build`. Unscoped that is
      # eleven at once, which exhausts a 4-vCPU runner and returns as a bare cancel, hence
      # the concurrency cap even now that the scope is usually far smaller.
      - name: Bundle isolation gates
        run: |
          bash scripts/ci-resource-probe.sh 30 &
          probe=$!
          trap 'kill "$probe" 2>/dev/null || true' EXIT
          pnpm exec turbo run test:dist --concurrency=3 --log-order=stream ${{ steps.scope.outputs.flag }}
      - name: Registry parity (rebuild shadcn registry, fail if drifted from source)
        run: pnpm check:registry

  # The turbo step took 14 minutes on main, analytics 5 of them. Analytics' unit suite, clock pass
  # and Mongo int lane now take about 6.5 minutes locally with three workers, roughly twice that
  # here, which puts a whole-workspace run at 17 to 20 minutes.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # Current and next Node LTS. Floor is 22.18 (native .ts config support,
        # see engines); 24 is forward-coverage for the next LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: scope
        name: Resolve affected scope
        run: bash scripts/ci-affected.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pre-cache the Mongo binary (avoid a parallel-download lockfile race)
        run: >-
          pnpm --filter @10x-media/payload-test-harness exec node -e
          "import('mongodb-memory-server').then((m) => m.MongoMemoryServer.create()).then((s) => s.stop()).then(() => process.exit(0))"
      # Every package's vitest runs 3 workers here, each booting Payload and an in-memory mongod.
      # turbo's default of 10 packages at once bursts past mongod's 10 s launch limit and 60 s
      # hooks; 4 rarely binds, since the typecheck tasks before each test already stagger them.
      - run: pnpm exec turbo run test --concurrency=4 ${{ steps.scope.outputs.flag }}

  # Analytics alone runs its whole int suite four times here: Mongo, Postgres, and SQLite with
  # its engine on worker threads and again on the main thread.
  test-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: scope
        name: Resolve affected scope
        run: bash scripts/ci-affected.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pre-cache the Mongo binary (avoid a parallel-download lockfile race)
        run: >-
          pnpm --filter @10x-media/payload-test-harness exec node -e
          "import('mongodb-memory-server').then((m) => m.MongoMemoryServer.create()).then((s) => s.stop()).then(() => process.exit(0))"
      # The same cap as `test`, for lanes that also start a Postgres container per boot.
      - run: pnpm exec turbo run test:matrix --concurrency=4 ${{ steps.scope.outputs.flag }}

  # The heaviest tier runs on demand (PR label or manual dispatch), not on every push,
  # so main stays fast. test-matrix already covers Postgres-in-Docker on push.
  test-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'parity')
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:container

  # The plugins whose e2e this change can reach. A plugin is picked when it or its dev app
  # is affected: the dev app is what e2e drives, and it can import other plugins
  # (admin-wiki-dev imports fields). Runs on pull requests and manual dispatch, where the
  # `no_e2e` label opts out; the scope fallback (CI changes, dispatch) picks every plugin.
  # A plugin in E2E_DATABASES gets one leg per database (its e2e.sh reads E2E_DBS), since all
  # of them in one leg would outrun the timeout; every other plugin keeps a single leg.
  e2e-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'push' && !contains(github.event.pull_request.labels.*.name, 'no_e2e')
    env:
      E2E_DATABASES: '{"analytics": ["mongo", "postgres", "sqlite"]}'
    outputs:
      plugins: ${{ steps.plugins.outputs.plugins }}
      legs: ${{ steps.plugins.outputs.legs }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: scope
        name: Resolve affected scope
        run: bash scripts/ci-affected.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: plugins
        name: Resolve plugins to e2e
        run: |
          e2e=$(jq -cn '[inputs | select(.scripts["test:e2e"]) | .name]' packages/*/package.json)
          plugins=$(pnpm exec turbo ls ${{ steps.scope.outputs.flag }} --output=json |
            jq -c --argjson e2e "$e2e" '[.packages.items[].name | rtrimstr("-dev") | select(IN($e2e[])) | ltrimstr("@10x-media/")] | unique')
          legs=$(jq -c --argjson dbs "$E2E_DATABASES" '[.[] as $p | ($dbs[$p] // [""])[] | {plugin: $p, dbs: .}]' <<<"$plugins")
          echo "e2e: ${plugins}"
          echo "legs: ${legs}"
          echo "plugins=${plugins}" >>"$GITHUB_OUTPUT"
          echo "legs=${legs}" >>"$GITHUB_OUTPUT"

  e2e:
    needs: e2e-scope
    if: needs.e2e-scope.outputs.plugins != '[]'
    name: e2e (${{ matrix.plugin }}${{ matrix.dbs && format(', {0}', matrix.dbs) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-scope.outputs.legs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @10x-media/${{ matrix.plugin }} exec playwright install --with-deps chromium
      - run: pnpm test:e2e ${{ matrix.plugin }}
        env:
          E2E_DBS: ${{ matrix.dbs }}
      # Traces of the failed tests' retries, and the HTML report where the plugin writes one. A
      # failing pass stops e2e.sh, so the next pass never clears its folders first.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.plugin }}${{ matrix.dbs && format('-{0}', matrix.dbs) || '' }}
          path: |
            packages/${{ matrix.plugin }}/test-results/
            packages/${{ matrix.plugin }}/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Upgrades a 1.0.0-beta.11 install to this tree on every database the way the upgrading page
  # says (packages/analytics/scripts/upgrade.sh). On pull requests and manual dispatch, when the
  # change reaches analytics through the package graph; the scope fallback always runs it. The
  # full history checkout also brings the beta.11 tag it checks out. The `no_e2e` label does not
  # skip it: it boots no browser, and it is the only check of the upgrading page's migration edits.
  analytics-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - id: scope
        name: Resolve affected scope
        run: bash scripts/ci-affected.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: reach
        name: Does the change reach analytics?
        run: |
          reached=$(pnpm exec turbo ls ${{ steps.scope.outputs.flag }} --filter=@10x-media/analytics --output=json |
            jq '.packages.items | length > 0')
          echo "analytics affected: ${reached}"
          echo "reached=${reached}" >>"$GITHUB_OUTPUT"
      - if: steps.reach.outputs.reached == 'true'
        run: pnpm test:upgrade analytics

  changeset-required:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-release')
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify changeset exists when packages changed
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD | grep -E '^packages/[^/]+/src/' || true)
          if [ -n "$CHANGED" ]; then
            CHANGES=$(pnpm changeset status --since=origin/main --output=/dev/stdout 2>/dev/null | grep -c 'releases:' || echo 0)
            if [ "$CHANGES" -eq 0 ]; then
              echo "::error::Packages changed but no changeset present. Run 'pnpm changeset' or apply 'no-release' label."
              exit 1
            fi
          fi
