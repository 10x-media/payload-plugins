name: Release Notes

# Creates a GitHub release from a package's CHANGELOG for a version tag (e.g.
# `@10x-media/jobs@4.0.0-alpha.1`). release.yml's publish job dispatches it once per
# published version, because a tag it pushes with GITHUB_TOKEN starts no workflow. A tag
# pushed by a person (`pnpm publish:plugin <name>`) triggers it directly.

on:
  push:
    tags:
      - '@10x-media/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. @10x-media/jobs@0.1.0-beta.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-notes-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Create GitHub release from changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          name="${TAG##*/}"; name="${name%@*}"
          version="${TAG##*@}"
          changelog="packages/${name}/CHANGELOG.md"
          if [ ! -f "$changelog" ]; then
            echo "::error::no changelog at $changelog for tag $TAG"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"
            exit 0
          fi
          node scripts/changelog-section.mjs "$changelog" "$version" > notes.md
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}"
          echo "created release $TAG"
