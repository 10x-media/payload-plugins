name: Release

# Opens/updates the "Version Packages" PR from queued changesets. It deliberately
# does NOT publish: the npm account is auth-and-writes 2FA and pnpm 10 has no OIDC,
# so publishing is manual (scripts/bootstrap-publish.sh) and GitHub releases are
# created by release-notes.yml when the version tag is pushed. Restore a `publish:`
# step here (with OIDC, no token) after the pnpm 11 + trusted-publishing migration.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
