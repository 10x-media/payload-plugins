name: Snapshot Release

on:
  pull_request:
    types: [labeled]

jobs:
  snapshot:
    if: github.event.label.name == 'snapshot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Snapshot releases are rejected in pre mode. Exit it for this ephemeral CI
      # checkout only (it is never committed back) so --snapshot can run.
      - run: pnpm changeset pre exit
      - run: pnpm changeset version --snapshot pr-${{ github.event.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm publish -r --tag pr-${{ github.event.number }} --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Snapshot release published. Install with:\n\n\`\`\`bash\npnpm add @10x-media/<package>@pr-${context.issue.number}\n\`\`\``
            })
